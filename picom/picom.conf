# ░█▀█░▀█▀░█▀▀░█▀█░█▄█░░░░█▀▀░█▀█░█▀█░█▀▀
# ░█▀▀░░█░░█░░░█░█░█░█░░░░█░░░█░█░█░█░█▀▀
# ░▀░░░▀▀▀░▀▀▀░▀▀▀░▀░▀░▀░░▀▀▀░▀▀▀░▀░▀░▀░░
#
#  X compositor configuration

#################################
#             Corners           #
#################################
corner-radius = 12.0;

#################################
#             Shadows           #
#################################

shadow = true;
shadow-radius = 7;
shadow-opacity = 0.75;
shadow-offset-x = -7;
shadow-offset-y = -7;

shadow-color = "#000000";

#################################
#           Fading              #
#################################

fading = true;
fade-in-step = 0.02;
fade-out-step = 0.02;
fade-delta = 3;

no-fading-openclose = false;
no-fading-destroyed-argb = false;

#################################
#   Transparency / Opacity      #
#################################

frame-opacity = 1;

rules = (
  # Smoothly interpolate tiled window geometry when LeftWM gives a surviving
  # window the space released by one that is closing.
  {
    match = "window_type = 'normal' || window_type = 'dialog'";
    fade = false;
    animations = (
      {
        # Hold the survivor in its old tile while the closing window fades,
        # then expand into the newly-cleared space.
        triggers = [ "geometry" ];
        scale-x = {
          curve = "cubic-bezier(0.07, 0.65, 0, 1)";
          delay = 0.14;
          duration = 0.16;
          start = "window-width-before / window-width";
          end = 1;
        };
        scale-y = {
          curve = "cubic-bezier(0.07, 0.65, 0, 1)";
          delay = 0.14;
          duration = 0.16;
          start = "window-height-before / window-height";
          end = 1;
        };
        offset-x = {
          curve = "cubic-bezier(0.07, 0.65, 0, 1)";
          delay = 0.14;
          duration = 0.16;
          start = "window-x-before - window-x";
          end = 0;
        };
        offset-y = {
          curve = "cubic-bezier(0.07, 0.65, 0, 1)";
          delay = 0.14;
          duration = 0.16;
          start = "window-y-before - window-y";
          end = 0;
        };
        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
        saved-image-blend = 0;
      },
      {
        # Existing tiles finish making room before the new window fades in.
        triggers = [ "open", "show" ];
        suppressions = [ "geometry" ];
        opacity = {
          curve = "linear";
          delay = 0.30;
          duration = 0.14;
          start = 0;
          end = "window-raw-opacity";
        };
        blur-opacity = {
          curve = "linear";
          delay = 0.30;
          duration = 0.14;
          start = 0;
          end = "window-blur-opacity";
        };
        shadow-opacity = {
          curve = "linear";
          delay = 0.30;
          duration = 0.14;
          start = 0;
          end = 0.75;
        };
      },
      {
        # Fade out in the old tile. The geometry animation above waits for this
        # phase before another window fills the space.
        triggers = [ "close", "hide" ];
        suppressions = [ "geometry" ];
        opacity = {
          curve = "linear";
          duration = 0.14;
          start = "window-raw-opacity-before";
          end = 0;
        };
        blur-opacity = {
          curve = "linear";
          duration = 0.14;
          start = "window-blur-opacity-before";
          end = 0;
        };
        shadow-opacity = {
          curve = "linear";
          duration = 0.14;
          start = 0.75;
          end = 0;
        };
      }
    );
  },
  # Picom v13 replacement for rounded-corners-exclude. Keep panels, docks,
  # and games square while regular application windows retain 12px corners.
  {
    match = "class_g = 'Polybar' || name = 'Eww - bar0' || class_g *= 'steam_app_' || STEAM_GAME || name = 'Path of Exile 2' || window_type *= 'dock'";
    corner-radius = 0;
  },
  {
    match = "fullscreen";
    corner-radius = 0;
  },
  {
    match = "window_type *= 'dock' || class_g = 'Polybar' || name = 'Eww - bar0'";
    opacity = 1.0;
    fade = false;
    shadow = false;
    blur-background = false;
  },
  {
    match = "window_type *= 'menu' || window_type = 'utility' || window_type = 'tooltip' || override_redirect";
    opacity = 0.82;
    blur-background = true;
  },
  {
    match = "(class_g = 'Eww' || class_g = 'eww' || class_i = 'Eww' || class_i = 'eww') && !(window_type *= 'dock')";
    blur-background = true;
  },
  {
    match = "class_g = 'eww-blur_full'";
    opacity = 0.10;
  },
  {
    match = "name = 'Notification' || class_g = 'Dunst' || class_g = 'slop' || class_g = 'Rofi' || _GTK_FRAME_EXTENTS@ || _NET_WM_STATE@ *= '_NET_WM_STATE_HIDDEN'";
    shadow = false;
  },
  {
    match = "class_g = 'slop' || window_type = 'desktop'";
    blur-background = false;
  },
  {
    match = "class_g = 'mpv' || class_g = 'sxiv' || class_g = 'kitty'";
    unredir = false;
  }
);

#################################
#     Background-Blurring       #
#################################

blur: {
	method = "dual_kawase";
    strength = 5;
}

blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;

#################################
#       General Settings        #
#################################

daemon = false;
backend = "glx";
vsync = true;
dbus = false;
detect-rounded-corners = true;
detect-client-opacity = true;
unredir-if-possible = true;

detect-transient = true;
detect-client-leader = true;

use-damage = true;

transparent-clipping = false;

log-level = "warn";
show-all-xerrors = false;
